name: VR Diff Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Delete vr-diffs orphan branch
    runs-on: ubuntu-latest
    # Mirrors the condition on ci.yml's `vr-diff-comment`, which is the only
    # thing that ever pushes a `vr-diffs/pr-N` branch. On a fork or Dependabot
    # PR no branch is ever created, AND the `pull_request` GITHUB_TOKEN is
    # downgraded to read-only there — so without this gate the job would try a
    # DELETE it cannot make, for a ref that does not exist, and go red on close.
    # Skipping is the fix rather than `pull_request_target`, which would hand a
    # write token to a fork-PR context for no gain.
    if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
    permissions:
      contents: write
    steps:
      # Deliberately the built-in GITHUB_TOKEN, not the CI-bot App: deleting a
      # branch does not need to trigger any workflow, and `permissions:` above
      # already grants it. Nothing here can rot when a bot identity changes —
      # which is exactly how this job broke on 2026-08-27, when the old
      # `kcvv-vr-bot` machine account was suspended and every merge went red.
      - name: Delete orphan branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="vr-diffs/pr-${PR_NUMBER}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/refs/heads/${BRANCH}")
          # 204 = deleted. 422 and 404 both mean the ref is not there (the PR had
          # no VR failures, so no orphan branch was ever pushed) — all fine.
          case "$HTTP_STATUS" in
            204 | 404 | 422)
              echo "Branch cleanup result: HTTP ${HTTP_STATUS} (OK)"
              ;;
            *)
              echo "::error::Unexpected HTTP ${HTTP_STATUS} while deleting ${BRANCH}"
              exit 1
              ;;
          esac
