# Self-hosted Renovate, replacing the Mend-hosted app.
#
# Mend's runner was being OOM-killed by `pnpm install --lockfile-only --recursive`
# on this workspace — the job died ~60s in, on the first branch that needed a
# lockfile, so no Renovate config knob could avoid it. See issue #13.
#
# Behaviour is unchanged: renovate.json is still the single source of truth and is
# picked up automatically. This only supplies a runner with enough memory.
#
# To work off a backlog outside the Monday window, dispatch this workflow with
# `ignoreSchedule: true`. Rate limits are untouched, so it opens at most 3
# concurrent PRs (renovate.json `prConcurrentLimit`) and 2 per hour (Renovate's
# default `prHourlyLimit`) — re-dispatch to take the next batch.
name: Renovate

on:
  # Daily, even though renovate.json gates normal updates to Monday: vulnerability
  # alerts bypass that schedule, so a daily tick keeps security fixes at <24h
  # instead of <7d. Runs with nothing to do finish in about a minute.
  schedule:
    - cron: "0 20 * * *" # 21:00 CET / 22:00 CEST — inside the Monday window
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info
      ignoreSchedule:
        description: "Ignore the Monday-only schedule and open PRs now"
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Actions minutes are billed on this repo, so cap a hung run rather than let
    # it drain the job limit. A full run is normally well under 10 minutes.
    timeout-minutes: 30

    steps:
      # Renovate runs as the `KCVV Elewijt CI Bot` GitHub App, not as a machine
      # account with a PAT. The token below is minted per run and expires in an
      # hour, so nothing long-lived sits in a secret, and an App cannot be
      # suspended the way the old `kcvv-vr-bot` user was on 2026-08-27.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.KCVV_APP_CLIENT_ID }}
          private-key: ${{ secrets.KCVV_APP_PRIVATE_KEY }}

      - uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # An installation token has no user behind it, so Renovate cannot
          # discover who it is committing as — both must be stated explicitly
          # or it refuses to open a PR.
          # `force` is the only override renovate.json's own `schedule` loses
          # to — a plain RENOVATE_SCHEDULE is outranked by the repo config.
          # It clears ONLY the top-level schedule: `prConcurrentLimit: 3` from
          # renovate.json and the default `prHourlyLimit: 2` both still apply,
          # so working off a backlog stays a trickle rather than a flood.
          RENOVATE_FORCE: ${{ inputs.ignoreSchedule && '{"schedule":null}' || '{}' }}
          RENOVATE_USERNAME: kcvv-elewijt-ci-bot[bot]
          RENOVATE_GIT_AUTHOR: kcvv-elewijt-ci-bot[bot] <321706059+kcvv-elewijt-ci-bot[bot]@users.noreply.github.com>
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
