name: Alert on red main

# main's push CI is the last thing that sees a merge commit, and it works: it
# went red on b4179a0e within minutes of the #2761 + #2754 merge race. Nobody
# was told, so a broken lockfile and a dead visual-regression runner sat on main
# for hours and every branch cut from it inherited both (#2874).
#
# Detection was never the gap — notification was. This turns a red run on main
# into a GitHub issue, which is the cheapest thing that reaches a human. It is
# deliberately NOT branch protection: requiring every PR to be up to date would
# re-run the whole pipeline (VR included, ~15 min) on every open PR each time
# anything merges, to prevent something main's own CI already catches.
#
# Note: workflow_run only ever runs the copy of this file on the default branch,
# so this does nothing until it is merged — including on its own PR.

on:
  workflow_run:
    workflows: ["CI/CD Pipeline", "E2E"]
    types: [completed]
    branches: [main]

# Both watched workflows run on the same push to main, so a commit that breaks
# them both fires two workflow_run events at once. Without this, each job would
# see no open ci-failure issue and both would create one. A single fixed group
# serialises them, so the second reads the issue the first just opened and
# comments instead.
#
# cancel-in-progress stays false on purpose: cancelling would throw away a real
# failure report, which is the one thing this workflow exists to deliver.
concurrency:
  group: main-red-alert
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  alert:
    name: Open or update the red-main issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    steps:
      - name: File the issue
        env:
          # Every value is GitHub-generated or a repo-owned workflow name, and
          # all of it arrives as env rather than `${{ }}` inside the script, so
          # nothing here can be shell-injected.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          TITLE="main is red"

          # --force upserts, so this is safe on every run.
          gh label create ci-failure \
            --color B60205 \
            --description "main's own CI is failing" \
            --force >/dev/null

          # One open issue at a time: a second failing workflow on the same
          # broken commit should add a line, not a duplicate issue.
          EXISTING=$(gh issue list --state open --label ci-failure \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          NOTE="\`$WF_NAME\` finished with **$CONCLUSION** on \`main\`.

          - Run: $RUN_URL
          - Commit: \`$HEAD_SHA\`"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$NOTE"
            echo "Commented on existing issue #$EXISTING"
          else
            gh issue create \
              --title "$TITLE" \
              --label ci-failure \
              --body "$NOTE

          Every branch cut from main inherits this until it is fixed or
          reverted. Close this issue once main is green again."
            echo "Opened a new red-main issue"
          fi
